name: Deterministic regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-regression:
    name: deterministic-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check comparison and instruction contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/sejong/scripts/test_compare_scorecards.py
          python3 -B docs/sejong/scripts/benchmark_sejong_surface.py --require-targets
          python3 -B docs/sejong/scripts/benchmark_instruction_surface.py --require-targets
